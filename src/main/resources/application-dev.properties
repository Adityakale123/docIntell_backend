spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.table-name=docintell_vectors
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.initialize-schema=true

app.rag.chunk-size=${RAG_CHUNK_SIZE:600}
app.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:100}
app.rag.top-k=${RAG_TOP_K:5}
app.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.0}

cors.allow-origin=${CORS_ALLOW_ORIGIN:*}
cors.allow-methods=${CORS_ALLOW_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allow-headers=${CORS_ALLOW_HEADERS:Content-Type,Authorization}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:50MB}