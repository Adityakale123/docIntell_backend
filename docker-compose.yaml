services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: doc-intell-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"

    environment:
      POSTGRES_DB: DocIntellDB
      POSTGRES_USER: Postgres
      POSTGRES_PASSWORD: root

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Postgres -d DocIntellDB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: